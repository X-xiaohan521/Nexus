app:
  data:
    directory: ${NEXUS_DATA:./data}
  mq:
    request: mq.evaluate.request
    result: mq.evaluate.result
  captcha:
    id: ${NEXUS_CAPTCHA_ID}
    key: ${NEXUS_CAPTCHA_KEY}

server:
  port: 6780

spring:
  application:
    name: backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:sqlite:${app.data.directory}/data.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.orm.jdbc.bind: trace
  output:
    ansi:
      enabled: always
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB